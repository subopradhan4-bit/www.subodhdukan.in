async function showBox(type){
  document.getElementById('signupWrap').style.display = type=='signup' ? 'block' : 'none';
  document.getElementById('loginWrap').style.display = type=='login' ? 'block' : 'none';
  document.getElementById('tabSignup').style.background = type=='signup' ? '#0e6a3c' : '#555';
  document.getElementById('tabLogin').style.background = type=='login' ? '#0e6a3c' : '#555';
  
  // MPIN text reset - Ab Firebase se
  if(type=='login'){
    try{
      let ph = localStorage.getItem("bandua_mobile");
      if(!ph){
        // Signup hua hi nahi hai to Banao dikhao
        document.getElementById('mpinHeading').innerText = "MPIN Banao 🔐";
        document.getElementById('mpinSub').innerText = "4 Ank ka code jo aapko yaad rahe";
        document.getElementById('mpinBtn').innerText = "MPIN SAVE & DUKAN";
        return;
      }
      let ref = window.doc(window.db,"customers",ph);
      let snap = await window.getDoc(ref);
      if(snap.exists() && snap.data().mpinHash){
        // Firebase me MPIN hai -> Dalo
        document.getElementById('mpinHeading').innerText = "MPIN Dalo 🔐";
        document.getElementById('mpinSub').innerText = "Apna 4 ank ka MPIN dalo";
        document.getElementById('mpinBtn').innerText = "LOGIN & DUKAN KHOLO";
      }else{
        // Firebase me nahi hai -> Banao
        document.getElementById('mpinHeading').innerText = "MPIN Banao 🔐";
        document.getElementById('mpinSub').innerText = "4 Ank ka code jo aapko yaad rahe";
        document.getElementById('mpinBtn').innerText = "MPIN SAVE & DUKAN";
      }
    }catch(e){
      // Error aaye to Banao hi dikhao
      document.getElementById('mpinHeading').innerText = "MPIN Banao 🔐";
      document.getElementById('mpinSub').innerText = "4 Ank ka code jo aapko yaad rahe";
      document.getElementById('mpinBtn').innerText = "MPIN SAVE & DUKAN";
    }
  }
}
async function doMpinLogin(){
  let input = document.getElementById('lMpin');
  let error = document.getElementById('mpinError');
  let val = input.value.trim();
  error.style.display = "none";
  input.style.border = "1.5px solid #ccc";
  if(val.length != 4){
    error.innerText = " ❌ 4 ank ka MPIN dalo";
    error.style.display = "block";
    input.style.border = "1.5px solid red";
    return;
  }
  let ph = localStorage.getItem("bandua_mobile") || document.getElementById("sPhone").value.replace(/\D/g,'').slice(-10);
  try{
    let ref = window.doc(window.db,"customers",ph);
    let snap = await window.getDoc(ref);
    let hash = await window.sha256(val);
    if(snap.exists() && snap.data().mpinHash){
      if(hash !== snap.data().mpinHash){
        error.innerText = " ❌ Galat MPIN hai! Sahi MPIN dalo";
        error.style.display = "block";
        input.style.border = "1.5px solid red";
        input.value = ""; input.focus();
        return;
      }
    }else{
      await window.setDoc(ref, { mpinHash: hash }, {merge:true});
    }
    localStorage.setItem('bandua_logged_in','true');
    location.href='index.html';
  }catch(e){
    // Firebase fail ho bhi jaye to rokna nahi hai, bina mpin ke dukan nahi khulegi
    console.log("Firebase error:", e);
    error.innerText = " ❌ First Signup kare >Uske bad mpin dale";
    error.style.display = "block";
  }
}

async function resetMpin(){
 if(!confirm("Naya MPIN banana hai? Google Verify karna hoga")) return;
 try{
  await window.signInWithPopup(window.auth, window.provider);
  let ph = localStorage.getItem("bandua_mobile");
  if(ph) await window.setDoc(window.doc(window.db,"customers",ph), { mpinHash: "" }, {merge:true});
  localStorage.removeItem('bandua_mpin');
  localStorage.removeItem('bandua_logged_in');
  document.getElementById('lMpin').value = "";
  document.getElementById('lMpin').focus();
  document.getElementById('mpinHeading').innerText = "Naya MPIN Banao 🔄";
  document.getElementById('mpinSub').innerText = "Verify ho gaya, naya 4 ank dalo";
  document.getElementById('mpinBtn').innerText = "Naya MPIN Save Karo";
 }catch(e){ alert("Verify fail: "+e.message); }
}

</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyBRZ86_UnSvgPBEImKCr1D4gDyZISvlf0U", authDomain: "subodh-dukan.firebaseapp.com", projectId: "subodh-dukan", storageBucket: "subodh-dukan.firebasestorage.app", messagingSenderId: "368451643879", appId: "1:368451643879:web:ee91ef9d797b480bd4b542" };



const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

window.db = db;
window.doc = doc;
window.setDoc = setDoc;
window.getDoc = getDoc;
window.sha256 = sha256;
window.auth = auth;
window.provider = provider;
window.signInWithPopup = signInWithPopup;



window.loadVillages = async () => {
  const sel = document.getElementById("sAdd");
  try{
    const snap = await getDoc(doc(db,"settings","villages"));
    if(snap.exists() && snap.data().list && snap.data().list.length > 0){
      const list = snap.data().list;
      sel.innerHTML = '<option value="">-- Village Chuniye --</option>' + list.map(v=>`<option value="${v}">${v}</option>`).join("");
    }else{
      sel.innerHTML = '<option value="">-- Village Chuniye --</option>';
    }
  }catch(e){
    sel.innerHTML = '<option value="">-- Village Chuniye --</option>';
  }
}

window.loadVillages();

let googleVerified = false;
document.getElementById("googleBtn").onclick = async () => {
  if(!document.getElementById("sName").value.trim()){
    alert("Pehle Name aur Mobile No likho");
    return;
  }
  try{
    const res = await signInWithPopup(auth, provider);
    googleVerified = true;
    localStorage.setItem("bandua_email", res.user.email);
    document.getElementById("googleBtn").innerHTML = "<span style='color:#0e5c36; font-weight:bold; font-size:18px;'>✓</span> Verified: " + res.user.email;
  }catch(e){
    alert("Google Login Fail: " + e.message);
  }
}

window.doSignup = async () => {
  let n = document.getElementById("sName").value.trim();
  
  /* mo no bina space
  let ph = document.getElementById("sPhone").value.trim();
 */
 let ph = document.getElementById("sPhone").value.replace(/\s/g, '').replace(/\D/g, '').slice(-10);
 
 
  let vil = document.getElementById("sAdd").value;
  if(!n) return alert("Naam likho");
  if(ph.length != 10) return alert("10 ank ka Mobile likho!");
  if(!vil) return alert("Gaon chuniye");
  if(!googleVerified && !localStorage.getItem("bandua_email")) return alert("Pehle Google se Verify kijiye");

  let email = localStorage.getItem("bandua_email") || "";
  localStorage.setItem("bandua_name", n);
  localStorage.setItem("bandua_mobile", ph);
  localStorage.setItem("bandua_village", vil);
  localStorage.setItem("customer", JSON.stringify({name:n, phone:ph, village:vil, email:email}));

  try{ await setDoc(doc(db, "customers", ph), { name: n, mobile: ph, village: vil, email: email, createdAt: new Date() }, {merge:true}); }catch(e){}


  window.showBox('login');
}

// YAHI MAIN FIX HAI - GitHub pe MPIN layega
onAuthStateChanged(auth, (user) => {
  if(user){
    // Google se verified 
    let mpin = localStorage.getItem('bandua_mpin');
    let logged = localStorage.getItem('bandua_logged_in');
    
    if(mpin){
      
      window.showBox('login');
      // Agar pehle se logged
    } else if (localStorage.getItem('customer')){
      
      window.showBox('login');
    }
  }
});

window.onload = function(){
  if(localStorage.getItem('customer')){
    window.showBox('login');
  }
}


</script>
