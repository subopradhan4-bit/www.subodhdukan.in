

<!DOCTYPE html>
<html lang="hi">
 <head>
   <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup -BANDUA CART</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top"><div class="brand"><h1>🛒 BANDUA CART</h1><div class="loc">📍 Bandua </div></div></div>


<div class="topTabs" style="display:flex; position:sticky; top:0;">
  <div id="tabSignup" onclick="showBox('signup')" style="flex:1; padding:14px; background:#0e6a3c; color:white; text-align:center; font-weight:bold;">Sign Up</div>
  <div id="tabLogin" onclick="showBox('login')" style="flex:1; padding:14px; background:#555; color:white; text-align:center; font-weight:bold;">Sign In</div>
</div>


<div class="signupWrap" id="signupWrap">
<h2 style="color:#0e6a3c">Customer Signup 🙏</h2>
<input id="sName" placeholder="Aapka Name*">
<input id="sPhone" placeholder="Mobile Number *">

<select id="sAdd" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc">
  <option value="">-- Village Chuniye --</option>







</select>

<div style="position:relative; margin:8px 0;">
  <input id="sPass" type="password" placeholder="Password *">
  <span onclick="toggleEye('sPass', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer;">👁️</span>
</div>

<div style="position:relative; margin:8px 0;">
  <input id="sRePass" type="password" placeholder="Re-Password *">
  <span onclick="toggleEye('sRePass', this)" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer;">👁️</span>
</div>





<div id="delPreview" style="font-size:13px;color:#e65100;margin:8px 0;font-weight:bold"></div>

<button onclick="doSignup()">Save & Home </button>



<button onclick="location.href='index.html'" style="background:#eee;color:#333">Back to Shop</button>
</div>



 <!-- aapka signup wala div yahan khatam hoga -->

<!-- Ye naya Login Box add karo -->
<div id="loginBox" class="signupWrap" style="display:none">
  <h2 style="color:#0e6a3c">Login 🙏</h2>
  <input id="lPhone" placeholder="Mobile Number">
  <input id="lPass" type="password" placeholder="Password">
  <button onclick="doLogin()">Login</button>
<p style="margin-top:10px;text-align:right">
  <a href="#" onclick="showForgot();return false;" style="color:#0e6a3c;font-size:14px">Forget Password?</a>
  </p>
</div>



<script>

function showBox(type){
  document.getElementById('signupWrap').style.display = type=='signup' ? 'block' : 'none';
  document.getElementById('loginBox').style.display = type=='login' ? 'block' : 'none';
}



function toggleEye(id, el){
  let inp = document.getElementById(id);
  if(inp.type === "password"){ inp.type = "text"; el.innerText="🙈"; }
  else { inp.type = "password"; el.innerText="👁️"; }
}


function showForgot(){
  let ph = document.getElementById("lPhone").value.trim();
  if(!ph){ 
    alert("Pehle Login me Mobile Number likho"); 
    return; 
  }
  let c = JSON.parse(localStorage.getItem("customer")||"{}");
  if(c.phone==ph){ 
    alert("Aapka Password hai: " + c.password);
    document.getElementById("lPass").value = c.password;
    document.getElementById("lPass").type = "text";
  } else { 
   alert("Pahle Signup kijiye 🙏");
  }
}


function loadVillages(){
  let v1 = JSON.parse(localStorage.getItem("villages") || "[]");
  let v2 = JSON.parse(localStorage.getItem("sd_villages") || "[]");
  let v3 = JSON.parse(localStorage.getItem("sd_villages_new") || "[]");
  
  let villages = v1.length ? v1 : (v2.length ? v2 : v3);
  
  if(villages.length === 0){
    villages = ["Bandua", "Bhagwanpur", "Rohua"];
  }

  let sel = document.getElementById("sAdd");
  if(!sel) return;

  sel.innerHTML = '<option value="">-- Village Chuniye --</option>' + 
  villages.map(v=>{
    let name = typeof v === 'object' ? v.name : v;
    return `<option value="${name}">${name}</option>`;
  }).join("");
}

function doSignup(){
  let n = document.getElementById("sName").value.trim();
  let ph = document.getElementById("sPhone").value.trim();
  let vil = document.getElementById("sAdd").value;
  let pass = document.getElementById("sPass") ? document.getElementById("sPass").value.trim() : "1234";
  
  if(!n) return alert("Naam likho");
  if(ph.length < 10) return alert("Sahi Mobile likho");
  if(!vil) return alert("Gaon chuniye");

  let customer = { name: n, phone: ph, village: vil, password: pass };
  localStorage.setItem("customer", JSON.stringify(customer));
  localStorage.setItem("sd_name", n);
  localStorage.setItem("sd_phone", ph);
  localStorage.setItem("sd_add", vil);
  localStorage.setItem("bandua_name", n);
  localStorage.setItem("bandua_mobile", ph);
  localStorage.setItem("bandua_village", vil);

  alert("Signup Success! Ab Login karo 🙏");
  showBox('login');
}
loadVillages();

function doLogin(){
  let ph = document.getElementById("lPhone").value.trim();
  let ps = document.getElementById("lPass").value.trim();
  let c = JSON.parse(localStorage.getItem("customer")||"{}");
  if(c.phone==ph && c.password==ps){
    location.href="index.html";
  } else {
    alert("Galat Password");
  }
}




</script>
</body></html>
