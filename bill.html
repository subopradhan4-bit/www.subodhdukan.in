
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bill</title>

<meta name="robots" content="noindex, nofollow">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
  
</script>
<style>body{font-family:system-ui;background:#f2f2f2;padding:10px}.c{background:#fff;max-width:480px;margin:auto;padding:18px;border-radius:14px}.r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #ddd;font-size:14px}.gt{font-weight:900;font-size:17px;border-top:2px solid #000;margin-top:6px;padding-top:6px}.btn{width:100%;max-width:480px;margin:10px auto;display:block;padding:13px;border:none;border-radius:12px;font-weight:800}.p{background:#0a5c36;color:#fff}.h{background:#fff;border:1px solid #ccc}</style>

</head>
<body>


<div id="successBox" style="display:none;max-width:480px;margin:0 auto 10px;background:#0a5c36;color:#fff;padding:14px;border-radius:14px;text-align:center"><div style="font-size:32px">✓</div><div style="font-size:20px;font-weight:900">Order Successfully Placed!</div></div>






<div class="c" id="b">Loading bill...</div>
<button class="btn p" id="dl">📄 Download Bill PDF</button>
<button class="btn h" onclick="location.href='index.html'">Home</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBRZ86_UnSvgPBEImKCr1D4gDyZISvlf0U",authDomain:"subodh-dukan.firebaseapp.com",projectId:"subodh-dukan",storageBucket:"subodh-dukan.firebasestorage.app",messagingSenderId:"368451643879",appId:"1:368451643879:web:ee91ef9d797b480bd4b542"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);



let finalIdGlobal = '';
async function loadBill(){
let id=new URLSearchParams(location.search).get('id');
let d=null; try{d=JSON.parse(localStorage.getItem('lastOrder'))}catch(e){}
if(id && (!d || d.orderId!==id)){
  let q=query(collection(db,"orders"),where("orderId","==",id));
  let snap=await getDocs(q);
  if(!snap.empty) d=snap.docs[0].data();
}
if(!d){document.getElementById('b').innerHTML=`<h3>No Order Found: ${id||''}</h3><a href=index.html>Home</a>`; return;}

document.getElementById('successBox').style.display='block';



let finalId=d.orderId||id;
finalIdGlobal = finalId;

let h=`<h2 style=text-align:center;color:#0a5c36;margin:0>🛒 BANDUA PUJA STORE ORDER</h2><p style=text-align:center;font-size:12px>Date: ${d.time}<br><b>Order ID: ${finalId}</b><br>📞 Admin No: +${d.adminNo || '918618265898'}</b></p><div style=font-size:14px><b>Name- ${d.name}</b><br><b>Mobile no- <a href="tel:${d.mobile}" style="color:#0a5c36;text-decoration:none">📞 ${d.mobile}</a></b><br><b>Village- ${d.village}</b></div><hr>`;
for(let k in d.cart){let p=d.allMap[k];if(!p)continue;let amt=p.price*d.cart[k];h+=`<div class=r><span>🔹 ${p.name} x ₹${p.price} x ${d.cart[k]}</span><b>₹${amt}</b></div>`;}



h+=`<div class=r><span>Total Item: ${Object.keys(d.cart).length}</span><span></span></div><div class=r><span>Total: ₹${d.total}</span><b>₹${d.total}</b></div><div class=r><span>Delivery: ₹${d.dCharge}</span><b>₹${d.dCharge}</b></div><div class="r gt"><span>Grand Total: ₹${d.grand}</span><b>₹${d.grand}</b></div><div style=font-size:13px;margin-top:8px><b>Delivery Time: ${d.deliveryTime}</b></div><p style=text-align:center>THANKS 🙏</p><div style=font-size:11px;word-break:break-all;margin-top:8px>📍 Location: <a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" style="color:#0a5c36;font-weight:900">https://www.google.com/maps?q=${d.lat},${d.lng}</a></div>`;
document.getElementById('b').innerHTML=h;
}



document.getElementById('dl').onclick=()=>{
  let el=document.getElementById('b');
  html2pdf().from(el).set({
    margin:0,
    filename:`BanduaPujaStore-${finalIdGlobal}.pdf`,
    image:{type:'jpeg', quality:0.98}, // png mat use karo
    html2canvas:{scale:3, scrollY:0, useCORS:true, backgroundColor:'#ffffff'},
    jsPDF:{unit:'px', format:[el.offsetWidth, el.scrollHeight], orientation:'portrait'},
    pagebreak:{mode:'avoid-all'}
  }).save();
};
loadBill();
</script>
</body>
</html>
